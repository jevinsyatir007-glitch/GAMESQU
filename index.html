<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Mini – GitHub Landing Page</title>
  <style>
  /* Material Design 3 (Material You) */
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@400;500;600&display=swap');

  :root {
    /* MD3 dynamic palette – using vibrant teal & amber for demo */
    --md-sys-color-primary: #0f9d58;
    --md-sys-color-on-primary: #ffffff;
    --md-sys-color-surface: #1e293b;
    --md-sys-color-on-surface: #e2e8f0;
    --md-sys-color-background: #0f172a;
    --md-sys-elevation-1: 2px 4px 6px rgba(0,0,0,0.2);
    --md-sys-elevation-2: 4px 8px 12px rgba(0,0,0,0.25);
    --md-sys-radius-large: 20px;
    --md-sys-radius-medium: 12px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--md-sys-color-background);
    font-family: 'Roboto', system-ui, sans-serif;
    color: var(--md-sys-color-on-surface);
  }

  .card {
    background: var(--md-sys-color-surface);
    border-radius: var(--md-sys-radius-large);
    box-shadow: var(--md-sys-elevation-2);
    padding: 32px;
    text-align: center;
  }

  .title {
    font-size: 2rem;
    font-weight: 500;
    margin-bottom: 12px;
    color: var(--md-sys-color-primary);
  }

  .scene {
    width: 260px;
    height: 260px;
    perspective: 800px;
    margin: 0 auto;
  }

  .cube {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: spin 8s infinite linear;
  }

  .cube div {
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--md-sys-color-primary);
    border: 4px solid var(--md-sys-color-on-surface);
    border-radius: var(--md-sys-radius-medium);
    box-shadow: var(--md-sys-elevation-1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 120px;
  }

  .cube div::before { content: "🤖"; }
  .front { transform: rotateY(0deg) translateZ(130px); }
  .back { transform: rotateY(180deg) translateZ(130px); }
  .right { transform: rotateY(90deg) translateZ(130px); }
  .left { transform: rotateY(-90deg) translateZ(130px); }
  .top { transform: rotateX(90deg) translateZ(130px); }
  .bottom { transform: rotateX(-90deg) translateZ(130px); }

  @keyframes spin {
    0%   { transform: rotateX(0deg) rotateY(0deg); }
    25%  { transform: rotateX(0deg) rotateY(90deg); }
    50%  { transform: rotateX(180deg) rotateY(90deg); }
    75%  { transform: rotateX(180deg) rotateY(180deg); }
    100% { transform: rotateX(0deg) rotateY(180deg); }
  }

  .scene:hover .cube { animation-duration: 4s; }
</style>
</head>
<body>
  <div class="scene">
    <div class="cube">
      <div class="front"></div>
      <div class="back"></div>
      <div class="right"></div>
      <div class="left"></div>
      <div class="top"></div>
      <div class="bottom"></div>
    </div>
  </div>
</body>
</html>
